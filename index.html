<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#FF7A45" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="二年级语文" />
  <title>二年级语文（上下册）· 趣味记课本</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="css/styles.css?v=4" />
</head>
<body>
  <div id="app" class="app-shell">
    <!-- 极简顶部栏 -->
    <header class="top-bar">
      <div class="brand" id="btn-home-logo" role="button" tabindex="0" aria-label="返回课本目录">
        <span class="brand-book" id="brand-book-icon">📕</span>
        <div class="brand-titles">
          <h1 id="brand-book-title">二年级上册 · 语文</h1>
          <p>人教版课本同步趣味记忆</p>
        </div>
      </div>

      <div class="top-right">
        <div class="star-counter" title="上下两册累计星星">
          <span>⭐</span>
          <strong id="total-stars-text">0 / 48</strong>
        </div>
        <button id="btn-sound-toggle" type="button" class="sound-toggle-btn" aria-label="切换声音开关">
          🔊 声音开
        </button>
      </div>
    </header>

    <!-- 画面一：课本目录页 -->
    <main id="screen-home" class="screen active" aria-label="课本单元目录">
      <!-- 直观好点的上下册双书切换胶囊 -->
      <div id="book-switcher" class="book-switcher" role="tablist" aria-label="选择二年级上册或下册"></div>

      <!-- 极简跨上下册找课文搜索栏 -->
      <div class="lesson-search-bar">
        <span class="search-icon" aria-hidden="true">🔍</span>
        <input
          id="lesson-search-input"
          type="search"
          class="lesson-search-input"
          placeholder="搜课文或古诗（如：刘胡兰、树之歌、咏柳、节气…）"
          autocomplete="off"
        />
        <button id="btn-search-clear" type="button" class="search-clear-btn hidden" aria-label="清空搜索">✕</button>
      </div>

      <!-- 搜索结果直达面板（平时隐藏，输入时跨册秒出） -->
      <section id="search-results-panel" class="search-results-panel hidden" aria-label="搜索课文结果"></section>

      <section id="welcome-banner" class="welcome-banner">
        <div class="welcome-info">
          <div class="welcome-title" id="welcome-book-heading">✨ 二年级上册 · 选一个单元开玩吧！</div>
          <div class="welcome-sub" id="welcome-progress-desc">本册已点亮 0 / 24 颗小星星（点课文名可单课专练）</div>
          <div class="total-bar-track">
            <div id="total-bar-fill" class="total-bar-fill" style="width: 0%"></div>
          </div>
        </div>
        <button id="btn-random-all" type="button" class="random-play-btn">
          🎲 本册随机玩
        </button>
      </section>

      <section id="unit-cards-list" class="unit-cards-list" aria-label="八个单元列表"></section>

      <footer class="home-footer">
        <button id="btn-reset-stars" type="button" class="subtle-reset-btn">重置星星记录</button>
      </footer>
    </main>

    <!-- 画面二：单元记忆乐园页 -->
    <main id="screen-unit" class="screen" aria-label="单元记忆乐园">
      <div class="unit-nav-bar">
        <button id="btn-back-home" type="button" class="back-btn">← 返回目录</button>
        <div class="unit-current-name" id="unit-header-title">第一单元</div>
        <div class="unit-header-stars" id="unit-header-stars">☆☆☆</div>
      </div>

      <!-- 本单元单篇课文切换胶囊（可玩全单元，也可点《刘胡兰》只练这一课！） -->
      <div id="unit-lesson-chips" class="lesson-filter-scroll" role="tablist" aria-label="按单篇课文筛选"></div>

      <!-- 四个一目了然的大模式按钮 -->
      <nav id="mode-tabs" class="mode-tabs" aria-label="选择学习或游戏方式">
        <button type="button" class="mode-tab active" data-mode="read">
          <span class="m-icon">📖</span>
          <span class="m-name">读课本</span>
        </button>
        <button type="button" class="mode-tab" data-mode="bubble">
          <span class="m-icon">🫧</span>
          <span class="m-name">戳泡泡</span>
          <span class="m-star" id="tab-star-bubble"></span>
        </button>
        <button type="button" class="mode-tab" data-mode="spell">
          <span class="m-icon">✍️</span>
          <span class="m-name">拼名句</span>
          <span class="m-star" id="tab-star-spell"></span>
        </button>
        <button type="button" class="mode-tab" data-mode="match">
          <span class="m-icon">🃏</span>
          <span class="m-name">消消乐</span>
          <span class="m-star" id="tab-star-match"></span>
        </button>
      </nav>

      <!-- 模式 1：📖 读课本 -->
      <section id="panel-read" class="game-panel active">
        <div class="read-toolbar">
          <span class="read-tip-text">💡 点喇叭听朗读，熟悉后去右边闯关拿星星！</span>
          <button id="btn-toggle-mask" type="button" class="mask-toggle-btn">🙈 遮住答案背一背</button>
        </div>
        <div id="read-cards-container" class="read-cards-list"></div>
        <div class="panel-bottom-cta">
          <button id="btn-read-go-play" type="button" class="primary-big-btn">🫧 读完啦，去玩戳泡泡拿星星！</button>
        </div>
      </section>

      <!-- 模式 2：🫧 戳泡泡 -->
      <section id="panel-bubble" class="game-panel">
        <div id="bubble-play-box" class="stage-box">
          <div class="stage-progress-row">
            <span id="bubble-lesson-tag" class="lesson-badge">课文同步</span>
            <span id="bubble-step-text" class="step-counter">第 1 / 8 题</span>
          </div>
          <div class="mini-progress-track">
            <div id="bubble-progress-fill" class="mini-progress-fill" style="width: 12.5%"></div>
          </div>

          <div class="question-board">
            <p id="bubble-question-text" class="question-big-text"></p>
            <button id="btn-bubble-speak" type="button" class="speak-chip-btn">🔊 听课文原句</button>
          </div>

          <p class="gentle-guide">👇 点一点写着正确答案的大泡泡：</p>
          <div id="bubble-pond" class="bubble-pond"></div>

          <div id="bubble-feedback" class="gentle-feedback hidden"></div>
          <button id="btn-bubble-next" type="button" class="primary-big-btn hidden">明白啦，下一题 ➡️</button>
        </div>

        <div id="bubble-finish-box" class="finish-box hidden"></div>
      </section>

      <!-- 模式 3：✍️ 拼名句 -->
      <section id="panel-spell" class="game-panel">
        <div id="spell-play-box" class="stage-box">
          <div class="stage-progress-row">
            <span id="spell-lesson-tag" class="lesson-badge">必背名句</span>
            <span id="spell-step-text" class="step-counter">第 1 / 6 题</span>
          </div>
          <div class="mini-progress-track">
            <div id="spell-progress-fill" class="mini-progress-fill" style="width: 16.6%"></div>
          </div>

          <div class="question-board">
            <p id="spell-prompt-text" class="question-big-text"></p>
            <button id="btn-spell-speak" type="button" class="speak-chip-btn">🔊 听整句朗读</button>
          </div>

          <p class="gentle-guide">👇 按顺序点下方汉字块填入空格（点空格里的字可退回）：</p>
          <div id="spell-slots" class="spell-slots"></div>
          <div id="spell-tiles" class="spell-tiles"></div>

          <div class="helper-btn-row" id="spell-helper-row">
            <button id="btn-spell-clear" type="button" class="secondary-btn">🔄 清空重填</button>
            <button id="btn-spell-hint" type="button" class="secondary-btn">💡 提示一个字</button>
          </div>

          <div id="spell-feedback" class="gentle-feedback hidden"></div>
          <button id="btn-spell-retry" type="button" class="primary-big-btn hidden">🔄 我看清啦，亲手再拼一遍！</button>
        </div>

        <div id="spell-finish-box" class="finish-box hidden"></div>
      </section>

      <!-- 模式 4：🃏 消消乐 -->
      <section id="panel-match" class="game-panel">
        <div id="match-play-box" class="stage-box">
          <div class="stage-progress-row">
            <span class="gentle-guide" style="margin:0;">👉 先点一张<strong class="txt-orange">橙色卡</strong>，再找配对的<strong class="txt-blue">蓝色卡</strong>！</span>
            <span id="match-step-text" class="step-counter">已消 0 / 6 对</span>
          </div>

          <div id="match-grid" class="match-grid"></div>
        </div>

        <div id="match-finish-box" class="finish-box hidden"></div>
      </section>
    </main>
  </div>

  <!-- 轻提示与通关撒花层 -->
  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
  <div id="confetti-layer" class="confetti-layer" aria-hidden="true"></div>

  <script src="js/data-s1.js?v=4"></script>
  <script src="js/data-s2.js?v=4"></script>
  <script src="js/textbook-data.js?v=4"></script>
  <script src="js/audio.js?v=4"></script>
  <script src="js/game-logic.js?v=4"></script>
  <script src="js/app.js?v=4"></script>
</body>
</html>
